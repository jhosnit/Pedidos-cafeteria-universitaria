services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cafeteria
      POSTGRES_USER: cafeteria
      POSTGRES_PASSWORD: cafeteria_pass
      TZ: America/Guayaquil
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeteria -d cafeteria"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/cafeteria
      DB_USER: cafeteria
      DB_PASSWORD: cafeteria_pass
      TZ: America/Guayaquil
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
